name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Pushes occasionally do not produce a workflow run — it has happened here, with
  # no path filter and no skip directive to explain it — and without this the only
  # remedies are an empty commit or a force push. A manual trigger is the honest
  # one, and it is also how a maintainer re-runs the full set after an
  # infrastructure failure without pretending something changed.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Format, Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the secret scan can see secrets that were committed
          # and later removed.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails the build on a known advisory in any dependency, direct or
      # transitive. It is here, before the slow steps, because a vulnerable
      # dependency is worth discovering in seconds rather than after a full test
      # run — and because a gate that runs late is one people learn to ignore.
      #
      # `--audit-level high` is the threshold rather than the default of `low`.
      # The advisories this tree has actually carried were both in `esbuild`,
      # reached only through build-time tooling — `drizzle-kit` and `tsup` — which
      # is never shipped and never serves traffic. Those were fixed rather than
      # tolerated (a lockfile override holds `esbuild` at a patched version), but
      # the threshold stays at high: failing every push on a moderate advisory in
      # a build tool trains people to re-run CI without reading it, which is worse
      # than not having the gate. High and critical are the severities with a real
      # exploit path, and a failure there should stop a merge.
      #
      # This gate can go red without anyone changing this repository, because the
      # advisory database is amended continuously. That is the intended
      # behaviour: it means the next push is held until somebody looks.
      - name: Dependency audit
        run: pnpm audit --audit-level high

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Secret scan (gitleaks)
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.30.1
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . --redact --no-banner --exit-code 1

  db-security:
    name: Database Security Guards
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: susu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/susu_test

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The guards inspect whatever is in the database, so the migrations are
      # applied first.
      #
      # This step is the difference between a guard that protects the schema and
      # one that only appears to. Run against an empty database, every guard
      # passes because there is nothing to inspect, and a table can reach
      # production with RLS missing while CI stays green.
      - name: Bootstrap Supabase shims and apply migrations
        run: |
          set -euo pipefail
          # Creates the roles, `auth.users` and `auth.uid()` that a hosted
          # Supabase project provides. Plain Postgres has none of them, so
          # without this the conditional foreign key in the profiles migration
          # would take its skip branch on every run and go untested.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f tests/db/bootstrap_supabase_shims.sql
          pnpm db:migrate

      - name: Verify the guards pass on the migrated database
        run: bash scripts/run-db-security-tests.sh

      - name: Verify the guards actually catch a table without RLS
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            'CREATE TABLE public.guard_self_test (id integer primary key);'
          if bash scripts/run-db-security-tests.sh; then
            echo "::error::The RLS guard failed to detect a table without RLS enabled."
            exit 1
          fi
          echo "Guard correctly detected the unprotected table."
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'DROP TABLE public.guard_self_test;'

      - name: Verify the guards catch an unconditionally permissive policy
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE public.guard_policy_test (id integer primary key);
          ALTER TABLE public.guard_policy_test ENABLE ROW LEVEL SECURITY;
          CREATE POLICY allow_everything ON public.guard_policy_test
            FOR SELECT USING (true);
          SQL
          if bash scripts/run-db-security-tests.sh; then
            echo "::error::The guard failed to detect an unconditionally permissive policy."
            exit 1
          fi
          echo "Guard correctly detected the permissive policy."
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'DROP TABLE public.guard_policy_test;'
